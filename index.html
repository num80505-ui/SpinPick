<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Wheel Picker</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f4f6fb;
  color:#222;
  transition:.3s;
}

body.dark{
  background:#111827;
  color:white;
}

header{
  padding:18px;
  background:white;
  box-shadow:0 2px 10px #0002;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dark header,
.dark .box{
  background:#1f2937;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:25px auto;
  padding:15px;
  display:grid;
  grid-template-columns:320px 1fr;
  gap:25px;
}

.box{
  background:white;
  border-radius:15px;
  padding:20px;
  box-shadow:0 3px 15px #0001;
}

textarea{
  width:100%;
  height:230px;
  padding:12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:16px;
}

button{
  border:0;
  padding:12px 16px;
  margin-top:10px;
  border-radius:9px;
  cursor:pointer;
  font-weight:bold;
}

.main{
  width:100%;
  background:#2563eb;
  color:white;
}

.shuffle{
  background:#f59e0b;
  color:white;
}

.clear{
  background:#e5e7eb;
}

.darkbtn{
  background:#111827;
  color:white;
}

.wheelbox{
  text-align:center;
}

.pointer{
  width:0;
  height:0;
  border-left:20px solid transparent;
  border-right:20px solid transparent;
  border-top:38px solid #111;
  margin:auto;
  position:relative;
  z-index:5;
}

#wheel{
  width:min(85vw,500px);
  height:min(85vw,500px);
  border-radius:50%;
  box-shadow:0 5px 25px #0004;
  transition:transform 5s cubic-bezier(.15,.75,.25,1);
}

.spin{
  background:#16a34a;
  color:white;
  font-size:21px;
  padding:15px 55px;
}

.result{
  font-size:25px;
  margin:20px 0;
  font-weight:bold;
}

.history{
  text-align:left;
  max-height:150px;
  overflow:auto;
}

.history div{
  padding:7px;
  border-bottom:1px solid #ddd;
}

@media(max-width:750px){
  .container{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🎡 Free Wheel Picker</div>
  <button class="darkbtn" onclick="darkMode()">🌙</button>
</header>

<div class="container">

<div class="box">

<h2>🎯 Choices</h2>

<p>Har line mein aik item likho:</p>

<textarea id="items">Ali
Ahmed
Usman
Hassan
Bilal
Ayesha</textarea>

<button class="main" onclick="updateWheel()">
🔄 Update Wheel
</button>

<button class="shuffle" onclick="shuffleItems()">
🔀 Shuffle
</button>

<button class="clear" onclick="clearAll()">
🗑 Clear
</button>

<h3>🏆 Winner History</h3>

<div id="history" class="history"></div>

</div>

<div class="box wheelbox">

<div class="pointer"></div>

<canvas id="wheel" width="500" height="500"></canvas>

<br>

<button class="spin" onclick="spin()">
🎯 SPIN
</button>

<div id="result" class="result">
Ready! 🎡
</div>

</div>

</div>

<script>

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let items=[];
let rotation=0;
let spinning=false;

const colors=[
"#ef4444",
"#f97316",
"#eab308",
"#22c55e",
"#06b6d4",
"#3b82f6",
"#8b5cf6",
"#ec4899"
];

function updateWheel(){

items=document.getElementById("items")
.value
.split("\n")
.map(x=>x.trim())
.filter(x=>x);

if(items.length<2){
alert("Kam az kam 2 items add karo!");
return;
}

draw();

document.getElementById("result").innerText=
"Ready to spin! 🎡";
}

function draw(){

ctx.clearRect(0,0,500,500);

let center=250;
let radius=250;
let angle=(Math.PI*2)/items.length;

items.forEach((item,i)=>{

let start=i*angle;
let end=start+angle;

ctx.beginPath();
ctx.moveTo(center,center);
ctx.arc(center,center,radius,start,end);
ctx.closePath();

ctx.fillStyle=colors[i%colors.length];
ctx.fill();

ctx.strokeStyle="white";
ctx.lineWidth=3;
ctx.stroke();

ctx.save();

ctx.translate(center,center);
ctx.rotate(start+angle/2);

ctx.fillStyle="white";
ctx.font="bold 18px Arial";
ctx.textAlign="right";

let text=item;

if(text.length>16)
text=text.substring(0,16)+"...";

ctx.fillText(text,radius-20,6);

ctx.restore();

});

}

function spin(){

if(spinning || items.length<2)return;

spinning=true;

let winner=Math.floor(
Math.random()*items.length
);

let segment=360/items.length;

let target=
360-(winner*segment+segment/2);

let extra=
360*(5+Math.floor(Math.random()*3));

rotation+=extra+target;

canvas.style.transform=
"rotate("+rotation+"deg)";

setTimeout(()=>{

let name=items[winner];

document.getElementById("result").innerHTML=
"🎉 Winner: <strong>"+name+"</strong>";

addHistory(name);

confetti();

spinning=false;

},5100);

}

function addHistory(name){

let history=
document.getElementById("history");

let div=document.createElement("div");

div.innerHTML="🏆 "+name;

history.prepend(div);

}

function shuffleItems(){

let arr=items.length?
items:
document.getElementById("items")
.value.split("\n")
.filter(x=>x.trim());

for(let i=arr.length-1;i>0;i--){

let j=Math.floor(Math.random()*(i+1));

[arr[i],arr[j]]=
[arr[j],arr[i]];

}

document.getElementById("items")
.value=arr.join("\n");

updateWheel();

}

function clearAll(){

document.getElementById("items").value="";

items=[];

ctx.clearRect(0,0,500,500);

document.getElementById("result")
.innerText="Add items first!";

}

function darkMode(){

document.body.classList.toggle("dark");

}

function confetti(){

for(let i=0;i<80;i++){

let c=document.createElement("div");

c.style.position="fixed";
c.style.width="8px";
c.style.height="8px";
c.style.background=
colors[Math.floor(Math.random()*colors.length)];

c.style.left=Math.random()*100+"vw";
c.style.top="-10px";
c.style.zIndex="9999";

document.body.appendChild(c);

let fall=setInterval(()=>{

c.style.top=
(parseFloat(c.style.top)+
Math.random()*8+3)+"px";

c.style.transform=
"rotate("+Math.random()*360+"deg)";

if(parseFloat(c.style.top)>1000){

clearInterval(fall);
c.remove();

}

},30);

}

}

updateWheel();

</script>

</body>
</html>
