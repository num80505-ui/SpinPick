<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpinPick</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f3f4f6;
  text-align:center;
}
h1{margin:20px 0}
.container{
  max-width:500px;
  margin:auto;
  padding:15px;
}
textarea{
  width:100%;
  height:110px;
  padding:12px;
  font-size:16px;
  border:2px solid #ddd;
  border-radius:12px;
}
.wheel-box{
  position:relative;
  width:320px;
  height:340px;
  margin:20px auto;
}
#wheel{
  width:300px;
  height:300px;
  border-radius:50%;
  border:8px solid #222;
  position:absolute;
  left:10px;
  top:30px;
  transition:transform 5s cubic-bezier(.12,.75,.18,1);
}
.pointer{
  position:absolute;
  top:0;
  left:calc(50% - 16px);
  z-index:5;
  width:0;
  height:0;
  border-left:16px solid transparent;
  border-right:16px solid transparent;
  border-top:32px solid red;
}
button{
  padding:12px 20px;
  margin:5px;
  border:0;
  border-radius:10px;
  font-size:16px;
  cursor:pointer;
}
#spin{
  background:#111;
  color:white;
}
#result{
  margin-top:15px;
  font-size:24px;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="container">

<h1>🎡 SpinPick</h1>

<div class="wheel-box">
  <div class="pointer"></div>
  <div id="wheel"></div>
</div>

<textarea id="names" placeholder="Har line mein aik name likhein&#10;Ali&#10;Ahmed&#10;Usman&#10;Bilal"></textarea>

<br>

<button onclick="updateWheel()">Update Wheel</button>
<button id="spin" onclick="spinWheel()">🎯 SPIN</button>

<div id="result">Winner yahan show hoga</div>

</div>

<script>

let rotation = 0;
let spinning = false;

function getNames(){
  return document.getElementById("names").value
    .split("\n")
    .map(name => name.trim())
    .filter(name => name.length > 0);
}

function updateWheel(){

  let names = getNames();

  if(names.length === 0){
    alert("Pehle names likhein!");
    return;
  }

  drawWheel(names);
  document.getElementById("result").innerText =
    names.length + " names ready!";
}

function drawWheel(names){

  let colors = [
    "#ff7675",
    "#74b9ff",
    "#55efc4",
    "#ffeaa7",
    "#a29bfe",
    "#fd79a8",
    "#fab1a0",
    "#81ecec"
  ];

  let part = 360 / names.length;
  let sections = [];

  for(let i=0;i<names.length;i++){

    let start = i * part;
    let end = (i + 1) * part;

    sections.push(
      colors[i % colors.length] +
      " " + start + "deg " + end + "deg"
    );
  }

  document.getElementById("wheel").style.background =
    "conic-gradient(" + sections.join(",") + ")";
}

function spinWheel(){

  if(spinning) return;

  let names = getNames();

  if(names.length === 0){
    alert("Pehle names likhein!");
    return;
  }

  spinning = true;

  drawWheel(names);

  let part = 360 / names.length;

  // Random winner
  let winnerIndex = Math.floor(Math.random() * names.length);

  /*
    Pointer 0 degree par hai.
    Wheel ko itna rotate karte hain ke
    selected section ka CENTER pointer ke neeche aaye.
  */
  let winnerCenter = winnerIndex * part + part / 2;

  let targetRotation = 360 - winnerCenter;

  let extraSpins = 360 * 6;

  rotation += extraSpins + targetRotation;

  document.getElementById("wheel").style.transform =
    "rotate(" + rotation + "deg)";

  setTimeout(function(){

    // YAHI selected index ka naam show hoga
    document.getElementById("result").innerText =
      "🎉 Winner: " + names[winnerIndex];

    spinning = false;

  },5000);
}

</script>

</body>
  </html>
