<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SpinPick - Random Wheel</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,sans-serif;
 background:#f3f4f6;
 color:#111;
 text-align:center;
}
body.dark{background:#171717;color:#fff}
.container{max-width:650px;margin:auto;padding:15px}
h1{font-size:32px;margin:15px 0 5px}
.sub{opacity:.7;margin-bottom:15px}

textarea{
 width:100%;height:110px;padding:12px;
 border:2px solid #ddd;border-radius:12px;
 font-size:16px;resize:vertical;
}
.dark textarea{background:#222;color:#fff;border-color:#555}

.buttons{
 display:flex;flex-wrap:wrap;
 justify-content:center;gap:7px;margin:10px 0
}
button{
 border:0;border-radius:10px;
 padding:11px 15px;font-size:15px;
 cursor:pointer;
}
#spin{
 background:#111;color:#fff;
 font-size:18px;padding:13px 30px;
}
.dark #spin{background:#fff;color:#111}

.wheelBox{
 width:330px;height:350px;
 margin:15px auto;position:relative;
}
#wheel{
 width:310px;height:310px;
 position:absolute;left:10px;top:30px;
 border-radius:50%;
 border:7px solid #222;
 overflow:hidden;
 transition:transform 5s cubic-bezier(.12,.75,.18,1);
}
.pointer{
 position:absolute;top:0;left:calc(50% - 16px);
 z-index:10;width:0;height:0;
 border-left:16px solid transparent;
 border-right:16px solid transparent;
 border-top:32px solid red;
}
#labels{
 position:absolute;left:10px;top:30px;
 width:310px;height:310px;
 pointer-events:none;
 border-radius:50%;
}
.label{
 position:absolute;
 left:50%;top:50%;
 width:120px;
 margin-left:-60px;
 margin-top:-10px;
 font-weight:bold;
 font-size:14px;
 text-align:center;
 transform-origin:60px 10px;
}

.result{
 margin:10px auto;
 padding:14px;
 border-radius:12px;
 background:#fff;
 font-size:24px;
 font-weight:bold;
}
.dark .result{background:#252525}

.history{
 margin-top:18px;
 text-align:left;
 background:#fff;
 border-radius:12px;
 padding:15px;
}
.dark .history{background:#252525}
.history h2{margin:0 0 10px;text-align:center}
.historyItem{
 padding:8px;
 border-bottom:1px solid #ddd;
}
.dark .historyItem{border-color:#444}
.empty{text-align:center;opacity:.6}

#confetti{
 position:fixed;inset:0;
 pointer-events:none;
 overflow:hidden;
 z-index:99;
}
.conf{
 position:absolute;
 width:9px;height:15px;
 animation:fall 2s linear forwards;
}
@keyframes fall{
 from{transform:translateY(-20px) rotate(0)}
 to{transform:translateY(100vh) rotate(720deg)}
}
</style>
</head>

<body>

<div id="confetti"></div>

<div class="container">

<h1>🎡 SpinPick</h1>
<div class="sub">Random Name Wheel</div>

<div class="wheelBox">
 <div class="pointer"></div>
 <div id="wheel"></div>
 <div id="labels"></div>
</div>

<div id="result" class="result">Winner yahan show hoga</div>

<textarea id="names"
placeholder="Har line mein aik name likhein&#10;Ali&#10;Ahmed&#10;Usman&#10;Bilal"></textarea>

<div class="buttons">
 <button onclick="updateWheel()">🔄 Update</button>
 <button onclick="shuffleNames()">🔀 Shuffle</button>
 <button onclick="clearNames()">🗑️ Clear Names</button>
</div>

<button id="spin" onclick="spinWheel()">🎯 SPIN</button>

<div class="buttons">
 <button onclick="toggleSound()">🔊 Sound ON</button>
 <button onclick="toggleDark()">🌙 Dark Mode</button>
 <button onclick="clearHistory()">🧹 Clear History</button>
 <button onclick="resetAll()">♻️ Reset</button>
</div>

<div class="history">
 <h2>📜 Spin History</h2>
 <div id="historyList" class="empty">Abhi koi history nahi</div>
</div>

</div>

<script>

let rotation=0;
let spinning=false;
let soundOn=true;

const colors=[
"#ff7675","#74b9ff","#55efc4","#ffeaa7",
"#a29bfe","#fd79a8","#fab1a0","#81ecec",
"#fdcb6e","#6c5ce7"
];

function getNames(){
 return document.getElementById("names").value
 .split("\n")
 .map(x=>x.trim())
 .filter(x=>x);
}

function saveNames(){
 localStorage.setItem("spinpick_names",
 document.getElementById("names").value);
}

function drawWheel(names){

 let wheel=document.getElementById("wheel");
 let labels=document.getElementById("labels");

 labels.innerHTML="";

 if(names.length===0){
  wheel.style.background="#ddd";
  return;
 }

 let part=360/names.length;
 let sections=[];

 for(let i=0;i<names.length;i++){
  sections.push(
   colors[i%colors.length]+" "+
   (i*part)+"deg "+
   ((i+1)*part)+"deg"
  );

  let label=document.createElement("div");
  label.className="label";
  label.innerText=names[i];

  let angle=i*part+part/2;

  label.style.transform=
   "rotate("+angle+"deg) translateY(-125px) rotate("+(-angle)+"deg)";

  labels.appendChild(label);
 }

 wheel.style.background=
  "conic-gradient("+sections.join(",")+")";
}

function updateWheel(){

 let names=getNames();

 if(!names.length){
  alert("Pehle names likhein!");
  return;
 }

 drawWheel(names);
 saveNames();

 document.getElementById("result").innerText=
 names.length+" names ready!";

}

function shuffleNames(){

 let names=getNames();

 if(!names.length)return;

 for(let i=names.length-1;i>0;i--){
  let j=Math.floor(Math.random()*(i+1));
  [names[i],names[j]]=[names[j],names[i]];
 }

 document.getElementById("names").value=
 names.join("\n");

 updateWheel();
}

function clearNames(){

 document.getElementById("names").value="";
 localStorage.removeItem("spinpick_names");

 document.getElementById("wheel").style.background="#ddd";
 document.getElementById("labels").innerHTML="";
 document.getElementById("result").innerText=
 "Winner yahan show hoga";
}

function spinWheel(){

 if(spinning)return;

 let names=getNames();

 if(!names.length){
  alert("Pehle names likhein!");
  return;
 }

 spinning=true;

 drawWheel(names);

 let part=360/names.length;

 let winnerIndex=
 Math.floor(Math.random()*names.length);

 let winnerCenter=
 winnerIndex*part+part/2;

 let target=
 360-winnerCenter;

 let current=rotation%360;

 let difference=(target-current+360)%360;

 rotation+=360*6+difference;

 document.getElementById("wheel").style.transform=
 "rotate("+rotation+"deg)";

 document.getElementById("labels").style.transform=
 "rotate("+rotation+"deg)";

 setTimeout(()=>{

  let winner=names[winnerIndex];

  document.getElementById("result").innerText=
   "🎉 Winner: "+winner;

  addHistory(winner);

  if(soundOn)playSound();

  makeConfetti();

  spinning=false;

 },5000);
}

function addHistory(winner){

 let history=
 JSON.parse(localStorage.getItem("spinpick_history")||"[]");

 history.unshift(winner);

 if(history.length>20)
 history=history.slice(0,20);

 localStorage.setItem(
  "spinpick_history",
  JSON.stringify(history)
 );

 showHistory();
}

function showHistory(){

 let history=
 JSON.parse(localStorage.getItem("spinpick_history")||"[]");

 let box=document.getElementById("historyList");

 if(!history.length){
  box.className="empty";
  box.innerText="Abhi koi history nahi";
  return;
 }

 box.className="";

 box.innerHTML=history.map((name,i)=>
  '<div class="historyItem">🏆 '+(i+1)+
  '. '+escapeHtml(name)+'</div>'
 ).join("");
}

function clearHistory(){

 localStorage.removeItem("spinpick_history");
 showHistory();
}

function toggleDark(){
 document.body.classList.toggle("dark");

 localStorage.setItem(
  "spinpick_dark",
  document.body.classList.contains("dark")
 );
}

function toggleSound(){
 soundOn=!soundOn;

 event.target.innerText=
 soundOn?"🔊 Sound ON":"🔇 Sound OFF";
}

function playSound(){

 try{
  let ctx=new (window.AudioContext||
  window.webkitAudioContext)();

  let osc=ctx.createOscillator();
  let gain=ctx.createGain();

  osc.connect(gain);
  gain.connect(ctx.destination);

  osc.frequency.value=700;
  gain.gain.value=.15;

  osc.start();
  osc.stop(ctx.currentTime+.25);
 }catch(e){}
}

function makeConfetti(){

 let box=document.getElementById("confetti");

 for(let i=0;i<70;i++){

  let c=document.createElement("div");
  c.className="conf";

  c.style.left=Math.random()*100+"%";
  c.style.background=
   colors[Math.floor(Math.random()*colors.length)];

  c.style.animationDelay=
   Math.random()*.5+"s";

  box.appendChild(c);

  setTimeout(()=>c.remove(),2500);
 }
}

function resetAll(){

 if(!confirm("Sab names aur history delete karni hai?"))
 return;

 localStorage.clear();

 document.getElementById("names").value="";
 document.getElementById("result").innerText=
 "Winner yahan show hoga";

 document.getElementById("wheel").style.background="#ddd";
 document.getElementById("labels").innerHTML="";

 showHistory();
}

function escapeHtml(text){

 let div=document.createElement("div");
 div.textContent=text;
 return div.innerHTML;
}

window.onload=function(){

 let saved=
 localStorage.getItem("spinpick_names");

 if(saved){
  document.getElementById("names").value=saved;
  drawWheel(getNames());
 }

 if(localStorage.getItem("spinpick_dark")==="true"){
  document.body.classList.add("dark");
 }

 showHistory();
};

</script>

</body>
</html>
